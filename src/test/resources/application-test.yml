spring:
  datasource:
    url: jdbc:h2:mem:test  # 테스트 데이터베이스 설정 (H2 메모리 데이터베이스 사용)
    username: sa
    password:
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.HSQLDialect  # H2 데이터베이스에 맞는 Dialect 설정

  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION}
    default-profile: ${DEFAULT_PROFILE}

  cloudfront:
    domain-name: ${AWS_CLOUDFRONT_DOMAIN}